<rect x="445" y="605" width="5" height="115" fill="#9c6526"/>
<text x="467" y="629" fill="#9c6526" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Validar e aplicar</text>
<text x="467" y="667" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Limites e confirmação</text>
<text x="467" y="696" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Atualização em ponto definido</text>
<rect x="835" y="590" width="310" height="145" rx="13" fill="#ffffff" stroke="#08766e" stroke-width="2"/>
<rect x="835" y="605" width="5" height="115" fill="#08766e"/>
