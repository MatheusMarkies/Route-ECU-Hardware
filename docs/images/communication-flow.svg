<rect x="55" y="605" width="5" height="115" fill="#245fa1"/>
<text x="77" y="629" fill="#245fa1" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">G0 · configuração</text>
<text x="77" y="667" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Recebe o que lhe pertence</text>
<text x="77" y="696" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Responde em outro quadro</text>
