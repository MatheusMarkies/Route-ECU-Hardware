<text x="857" y="667" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Fila própria de solicitações</text>
<text x="857" y="696" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Identificação e resposta</text>
<rect x="1225" y="590" width="310" height="145" rx="13" fill="#ffffff" stroke="#7054a1" stroke-width="2"/>
<rect x="1225" y="605" width="5" height="115" fill="#7054a1"/>
<text x="1247" y="629" fill="#7054a1" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">PC · tuning</text>
<text x="1247" y="667" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Envia alterações pelo USB</text>
<text x="1247" y="696" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Acompanha a confirmação</text>
