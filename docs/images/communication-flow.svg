<text x="77" y="267" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Prepara blocos de dados</text>
<text x="77" y="296" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Sequência, timestamp e CRC</text>
<text x="77" y="325" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Avisa quando está pronto</text>
