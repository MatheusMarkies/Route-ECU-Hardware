<text x="1247" y="267" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Recebe pelo USB do H7</text>
<text x="1247" y="296" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Exibe dados e estados</text>
<text x="1247" y="325" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Solicita parâmetros</text>
