<text x="467" y="492" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Prioridade sobre a comunicação; usa uma cópia consistente dos dados.</text>
<polyline points="600,360 600,415" fill="none" stroke="#52677b" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="600.00,415.00 595.00,403.00 605.00,403.00" fill="#52677b"/>
