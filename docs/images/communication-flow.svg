<text x="857" y="267" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Valida e atualiza o estado</text>
<text x="857" y="296" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Fila USB limitada</text>
<text x="857" y="325" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Atendimento sem bloqueio</text>
