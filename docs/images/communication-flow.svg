<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870">
<title>Comunicação entre os MCUs e o PC</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677b"/></marker></defs>
<rect width="1600" height="870" fill="#f7f9fc"/>
<text x="55" y="63" fill="#152c44" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Comunicação entre os MCUs e o PC</text>
<text x="55" y="105" fill="#52677b" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Proposta de firmware: transferências assíncronas e trabalho de comunicação limitado</text>
<rect x="55" y="190" width="310" height="170" rx="13" fill="#ffffff" stroke="#245fa1" stroke-width="2"/>
<rect x="55" y="205" width="5" height="140" fill="#245fa1"/>
