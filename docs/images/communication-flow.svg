<text x="467" y="267" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">H7 agenda a transferência</text>
<text x="467" y="296" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">DMA para TX e RX</text>
<text x="467" y="325" fill="#263d52" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Recepção em buffers</text>
<rect x="835" y="190" width="310" height="170" rx="13" fill="#ffffff" stroke="#08766e" stroke-width="2"/>
<rect x="835" y="205" width="5" height="140" fill="#08766e"/>
