<text x="405" y="638" fill="#52677b" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">SPI</text>
<polyline points="600,590 600,520" fill="none" stroke="#52677b" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="600.00,520.00 605.00,532.00 595.00,532.00" fill="#52677b"/>
<path d="M 55 778 H 1545" stroke="#d3dce6"/>
<text x="55" y="811" fill="#263d52" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">O painel pode substituir amostras antigas; comandos precisam de confirmação e tratamento de fila cheia.</text>
<text x="55" y="839" fill="#52677b" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">DMA, protocolo, taxas de atualização e jitter ainda precisam ser implementados e medidos.</text>
